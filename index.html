<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare up to three personal loan offers: the monthly payment (EMI), the cash you receive after the fee, and the total cost of borrowing." />
    <meta name="theme-color" content="#f3f4f8" />
    <title>Loan &amp; EMI Calculator</title>
    <script>
      // Apply the saved theme, or the system one, before the first paint so the page never flashes.
      let saved = null
      try {
        saved = localStorage.getItem('theme')
      } catch {}
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
